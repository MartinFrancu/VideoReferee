<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VideoReferee spike — camera</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  #preview { width: 100%; height: 70vh; object-fit: cover; background: #000; display: block; }
  #bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
  #status { padding: 4px 10px; border-radius: 12px; font-size: 14px; color: #fff; }
  #cameraLabel { font-size: 14px; opacity: 0.8; }
  #bookmarkBtn {
    display: block; width: calc(100% - 32px); margin: 12px 16px; padding: 22px;
    font-size: 22px; font-weight: bold; border: none; border-radius: 12px;
    background: #e74c3c; color: white;
  }
  #bookmarkBtn:active { background: #c0392b; }
  #log { font-size: 11px; opacity: 0.6; padding: 0 16px; white-space: pre-wrap; max-height: 15vh; overflow-y: auto; }
</style>
</head>
<body>
  <video id="preview" autoplay playsinline muted></video>
  <div id="bar">
    <span id="cameraLabel">-</span>
    <span id="status">connecting…</span>
  </div>
  <button id="bookmarkBtn">BOOKMARK</button>
  <div id="log"></div>
  <script src="camera.js"></script>
</body>
</html>

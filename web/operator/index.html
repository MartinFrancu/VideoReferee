<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VideoReferee — operator</title>
<style>
  :root {
    --ground: #11151a;
    --panel: #1a2027;
    --rule: #2b343d;
    --ink: #e6edf2;
    --faded: #8fa1ae;
    --live: #4bbf73;
    --dead: #d9534f;
    --accent: #45bec9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
           padding: 16px 22px; border-bottom: 1px solid var(--rule); }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .phase { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
           letter-spacing: 0.12em; text-transform: uppercase; color: var(--faded); }
  .spacer { flex: 1; }
  button { font: inherit; font-size: 14px; padding: 8px 16px; border-radius: 7px;
           border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06232a; font-weight: 600; }
  button:disabled { opacity: 0.4; cursor: default; }
  main { padding: 22px; display: grid; gap: 22px; max-width: 1100px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.09em;
               color: var(--faded); margin: 0 0 12px; font-weight: 600; }
  .cameras { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .camera { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; }
  .camera .name { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 9px; }
  .pip { width: 9px; height: 9px; border-radius: 50%; background: var(--dead); flex: none; }
  .camera.live .pip { background: var(--live); }
  .camera .detail { font-size: 12.5px; color: var(--faded); margin-top: 6px;
                    font-variant-numeric: tabular-nums; }
  .empty { color: var(--faded); font-size: 14px; }
  .add { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 7px;
          border: 1px solid var(--rule); background: var(--ground); color: var(--ink); min-width: 200px; }
  dialog { border: 1px solid var(--rule); border-radius: 12px; background: var(--panel);
           color: var(--ink); padding: 24px; max-width: 340px; }
  dialog::backdrop { background: rgba(0,0,0,0.6); }
  dialog h3 { margin: 0 0 4px; font-size: 18px; }
  dialog p { margin: 0 0 16px; color: var(--faded); font-size: 13.5px; }
  #qr { background: #fff; padding: 12px; border-radius: 8px; display: grid; place-items: center; }
  #qr svg { display: block; width: 100%; height: auto; }
  .joinUrl { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
             color: var(--faded); word-break: break-all; margin-top: 12px; }
</style>
</head>
<body>
  <header>
    <h1>VideoReferee</h1>
    <span class="phase" id="phase">idle</span>
    <span class="spacer"></span>
    <button id="startBtn" class="primary">Start bout</button>
    <button id="stopBtn">Stop</button>
  </header>

  <main>
    <section>
      <h2>Cameras</h2>
      <div class="cameras" id="cameras"></div>
      <p class="empty" id="noCameras">No cameras yet. Add one and scan the code with its phone.</p>
    </section>

    <section>
      <h2>Add a camera</h2>
      <div class="add">
        <input id="cameraName" placeholder="Who is holding it? e.g. mike" autocomplete="off" />
        <button id="addBtn">Add camera</button>
      </div>
    </section>
  </main>

  <dialog id="qrDialog">
    <h3 id="qrName">camera</h3>
    <p>Scan with that phone. Accept the certificate warning once.</p>
    <div id="qr"></div>
    <div class="joinUrl" id="joinUrl"></div>
    <p style="margin:16px 0 0"><button id="qrClose">Done</button></p>
  </dialog>

  <script src="operator.js"></script>
</body>
</html>

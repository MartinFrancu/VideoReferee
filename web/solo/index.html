<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the preview reaches the edges on a notched phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>VideoReferee Solo</title>
    <style>
      :root {
        --ground: #0b0f12;
        --panel: #151b20;
        --ink: #e8edf0;
        --faded: #8a969e;
        --rule: #2a343b;
        --accent: #37c8d8;
        --mark: #e05252;
        --warm: #e0a020;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--ground);
        color: var(--ink);
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        /* dvh, or the iOS toolbars steal the bottom of the screen. */
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      /* Which screen is showing. Everything else is display:none. */
      section { display: none; flex: 1; min-height: 0; flex-direction: column; }
      body[data-screen="live"] #live,
      body[data-screen="review"] #review { display: flex; }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      button {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 12px 16px;
        cursor: pointer;
        /* A tap on a phone must not also be a double-tap zoom or a text select. */
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      button:disabled { opacity: 0.35; }
      button:active:not(:disabled) { filter: brightness(1.25); }

      /* ---------- the live screen ---------- */

      .stage { position: relative; flex: 1; min-height: 0; }

      .hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        font-size: 14px;
        background: linear-gradient(rgba(0, 0, 0, 0.55), transparent);
        /* This sits over whatever the camera is pointed at, which may be pale. */
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      .hud .grow { flex: 1; }
      #elapsed { font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; }
      #recording-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--mark);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.25; } }

      /* One dot per mark taken, so the count is readable without counting. */
      #dots { display: flex; gap: 6px; }
      #dots i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 1px solid var(--faded);
        display: block;
      }
      #dots i.on { background: var(--mark); border-color: var(--mark); }

      .icon {
        padding: 4px 9px;
        font-size: 15px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.4);
      }

      /* The thumb end of the screen. BOOKMARK is deliberately enormous. */
      .actions { display: flex; gap: 10px; padding: 12px; flex: none; }
      #start, #bookmark { flex: 1; font-size: 26px; font-weight: 700; letter-spacing: 0.04em; padding: 26px 16px; }
      #start { background: var(--accent); color: #06232a; border-color: var(--accent); }
      #bookmark { background: var(--mark); border-color: var(--mark); color: #fff; }
      #stop { flex: none; font-size: 16px; }

      /* ---------- the review screen ---------- */

      #tabs { display: flex; gap: 8px; padding: 10px 12px 0; flex: none; }
      #tabs button { flex: 1; font-size: 20px; font-weight: 700; padding: 14px 0; }
      #tabs button.on { border-color: var(--accent); color: var(--accent); }

      #shortfall {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 7px 12px;
        font-size: 13px;
        color: var(--warm);
        background: rgba(0, 0, 0, 0.6);
        text-align: center;
      }
      #shortfall:empty { display: none; }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px 0;
        flex: none;
      }
      .controls .step { font-size: 24px; padding: 16px 0; flex: 1; }
      #play { flex: 1.2; font-size: 17px; padding: 16px 0; }
      select {
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 15px 8px;
      }

      .scrubline { display: flex; align-items: center; gap: 10px; padding: 10px 12px 0; flex: none; }
      /* The scrub spans the window, not the recording: that is what is under review. */
      #scrub { flex: 1; accent-color: var(--accent); min-width: 0; }
      #readout {
        font-family: ui-monospace, Menlo, monospace;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        min-width: 66px;
        text-align: right;
        color: var(--faded);
      }

      /* How much either side of a mark to show. Here so the right numbers can be
         found by trying them, rather than guessed once and baked in. */
      .tune { display: flex; gap: 14px; padding: 10px 12px 0; font-size: 13px; color: var(--faded); flex: none; }
      .tune label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
      .tune input { flex: 1; min-width: 0; accent-color: var(--faded); }
      /* Fixed width, or the value is the thing that gets pushed off the screen. */
      #lead-value, #tail-value { flex: none; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

      .foot { display: flex; gap: 10px; padding: 12px; flex: none; }
      #again { flex: 1; }

      /* ---------- diagnostics ---------- */

      #diag {
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
        background: #06090b;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12.5px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        z-index: 10;
      }
      #diag[hidden] { display: none; }
      #diag h2 { font-size: 13px; margin: 18px 0 4px; color: var(--accent); }
      #diag .close { position: sticky; top: 0; float: right; }
      #diag .headline { color: var(--warm); }

      .note { padding: 12px; color: var(--faded); font-size: 13.5px; text-align: center; }

      /* ---------- held sideways ----------

         A fight moves across, not up, so the phone will be held landscape — and
         a phone on its side has about 400px of height, which the stacked
         controls would eat entirely. Put them down the right instead and leave
         the footage the whole of the rest. */
      @media (orientation: landscape) and (max-height: 600px) {
        #live { flex-direction: row; }
        #live-note { display: none; }
        .actions { flex-direction: column; width: 180px; justify-content: center; }
        #start, #bookmark { font-size: 21px; padding: 20px 8px; }

        body[data-screen="review"] #review {
          display: grid;
          grid-template-columns: 1fr 270px;
          grid-template-rows: auto auto auto auto 1fr;
          grid-template-areas:
            "stage tabs"
            "stage controls"
            "stage scrub"
            "stage tune"
            "stage foot";
        }
        #review .stage { grid-area: stage; }
        #tabs { grid-area: tabs; padding-left: 0; }
        .controls { grid-area: controls; padding-left: 0; }
        .controls .step, #play { padding: 12px 0; }
        .scrubline { grid-area: scrub; padding-left: 0; }
        .tune { grid-area: tune; flex-direction: column; gap: 4px; padding-left: 0; }
        .foot { grid-area: foot; align-items: flex-end; padding-left: 0; }
      }
    </style>
  </head>
  <body data-screen="live">
    <!-- ---------------- live ---------------- -->
    <section id="live">
      <div class="stage">
        <video id="preview" playsinline muted autoplay></video>
        <div class="hud">
          <span id="recording-dot" hidden></span>
          <span id="elapsed">0:00</span>
          <span id="dots"></span>
          <span class="grow"></span>
          <button class="icon" id="info" title="What this device can do">&#9432;</button>
        </div>
      </div>
      <p class="note" id="live-note">Point it at the fight, then press START.</p>
      <div class="actions">
        <button id="start">START</button>
        <button id="bookmark" hidden>BOOKMARK</button>
        <button id="stop" hidden>STOP</button>
      </div>
    </section>

    <!-- ---------------- review ---------------- -->
    <section id="review">
      <nav id="tabs"></nav>
      <div class="stage">
        <video id="clip" playsinline></video>
        <div id="shortfall"></div>
      </div>

      <div class="controls">
        <button class="step" id="back" title="one frame back">&#9664;</button>
        <button id="play">Play</button>
        <button class="step" id="fwd" title="one frame on">&#9654;</button>
        <select id="rate" title="speed">
          <option value="1">1&times;</option>
          <option value="0.5">&frac12;&times;</option>
          <option value="0.25">&frac14;&times;</option>
        </select>
      </div>

      <div class="scrubline">
        <input id="scrub" type="range" step="1" />
        <span id="readout">+0.00s</span>
      </div>

      <div class="tune">
        <label>before <input id="lead" type="range" min="500" max="4000" step="100" /><span id="lead-value"></span></label>
        <label>after <input id="tail" type="range" min="200" max="3000" step="100" /><span id="tail-value"></span></label>
      </div>

      <div class="foot">
        <button id="again">New bout</button>
        <button class="icon" id="info2" title="What this device can do">&#9432;</button>
      </div>
    </section>

    <div id="diag" hidden></div>

    <script type="module" src="solo.js"></script>
  </body>
</html>

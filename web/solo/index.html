<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the preview reaches the edges on a notched phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>VideoReferee Solo</title>
    <style>
      :root {
        --ground: #0b0f12;
        --panel: #151b20;
        --ink: #e8edf0;
        --faded: #8a969e;
        --rule: #2a343b;
        --accent: #37c8d8;
        --mark: #e05252;
        --warm: #e0a020;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--ground);
        color: var(--ink);
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        /* dvh, or the iOS toolbars steal the bottom of the screen. */
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      section { display: none; flex: 1; min-height: 0; flex-direction: column; }
      body[data-screen="live"] #live,
      body[data-screen="review"] #review { display: flex; }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      button {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 12px 16px;
        cursor: pointer;
        /* A tap on a phone must not also be a double-tap zoom or a text select. */
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      button:disabled { opacity: 0.35; }
      button:active:not(:disabled) { filter: brightness(1.25); }

      .stage { position: relative; flex: 1; min-height: 0; }

      /* ---------- the live screen ---------- */

      .hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        font-size: 14px;
        background: linear-gradient(rgba(0, 0, 0, 0.55), transparent);
        /* This sits over whatever the camera is pointed at, which may be pale. */
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      .hud .grow { flex: 1; }
      #elapsed { font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; }
      #recording-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--mark);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.25; } }

      #dots { display: flex; gap: 6px; }
      #dots i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 1px solid var(--faded);
        display: block;
      }
      #dots i.on { background: var(--mark); border-color: var(--mark); }

      .icon {
        padding: 4px 9px;
        font-size: 15px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.4);
      }

      .actions { display: flex; gap: 10px; padding: 12px; flex: none; }
      #start, #bookmark { flex: 1; font-size: 26px; font-weight: 700; letter-spacing: 0.04em; padding: 26px 16px; }
      #start { background: var(--accent); color: #06232a; border-color: var(--accent); }
      #bookmark { background: var(--mark); border-color: var(--mark); color: #fff; }
      #stop { flex: none; font-size: 16px; }

      /* ---------- the review screen ----------

         Two thin edges hold what is always needed — which mark, and which way of
         looking at it — and the band between them belongs to one mode at a time.
         Everything a mode does not need is not on the screen while it is on. */

      #topbar { display: flex; gap: 8px; padding: 10px 12px 0; flex: none; align-items: stretch; }
      #tabs { display: flex; gap: 8px; flex: 1; min-width: 0; }
      #tabs button { flex: 1; font-size: 20px; font-weight: 700; padding: 12px 0; }
      #tabs button.on { border-color: var(--accent); color: var(--accent); }
      #again { font-size: 13px; padding: 12px 10px; flex: none; }

      /* Over the footage rather than beside it: it costs no room there. */
      #readout {
        position: absolute;
        top: 8px;
        right: 10px;
        font-family: ui-monospace, Menlo, monospace;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        padding: 3px 7px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: var(--ink);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }

      /* Where in the window the footage is, without spending a row on saying so. */
      #progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, 0.14); }
      #progress i { display: block; height: 100%; width: 0; background: var(--accent); }

      #shortfall {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 3px;
        padding: 7px 12px;
        font-size: 13px;
        color: var(--warm);
        background: rgba(0, 0, 0, 0.6);
        text-align: center;
      }
      #shortfall:empty { display: none; }

      /* The one strip belonging to whichever mode is on. */
      .band { flex: none; padding: 10px 12px 0; }
      .strip { display: none; gap: 8px; align-items: center; }
      #review[data-mode="loop"] .strip[data-mode="loop"],
      #review[data-mode="scrub"] .strip[data-mode="scrub"],
      #review[data-mode="step"] .strip[data-mode="step"],
      #review[data-mode="shuttle"] .strip[data-mode="shuttle"] { display: flex; }

      .strip[data-mode="loop"] button { flex: 1; font-size: 18px; padding: 18px 0; }
      .strip[data-mode="loop"] button.on { border-color: var(--accent); color: var(--accent); }

      .strip[data-mode="scrub"] { flex-direction: column; align-items: stretch; gap: 10px; }
      /* Tall, because it is the whole interaction in this mode. */
      #scrub { width: 100%; accent-color: var(--accent); height: 34px; }
      .toggle { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--faded); }
      .toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

      .strip[data-mode="step"] button { flex: 1; font-size: 17px; padding: 20px 0; }

      .strip[data-mode="shuttle"] { justify-content: center; }
      .hint { font-size: 13.5px; color: var(--faded); padding: 20px 0; text-align: center; }

      /* Dragging the picture must not drag the page with it. */
      #review[data-mode="shuttle"] .stage { touch-action: none; }

      #modes { display: flex; gap: 8px; padding: 10px 12px; flex: none; }
      #modes button { flex: 1; font-size: 14px; padding: 13px 0; }
      #modes button.on { border-color: var(--accent); color: var(--accent); background: rgba(55, 200, 216, 0.1); }

      /* ---------- the panel behind the ⓘ ---------- */

      #diag {
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
        background: #06090b;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12.5px;
        line-height: 1.6;
        z-index: 10;
      }
      #diag[hidden] { display: none; }
      #diag-body { white-space: pre-wrap; word-break: break-word; }
      #diag h2 { font-size: 13px; margin: 18px 0 4px; color: var(--accent); }
      #diag .close { position: sticky; top: 0; float: right; }
      #diag .headline { color: var(--warm); }

      /* Set once, not while looking — so they live here rather than on the screen. */
      .tune { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--faded); }
      .tune label { display: flex; align-items: center; gap: 10px; }
      .tune input[type="range"] { flex: 1; min-width: 0; accent-color: var(--faded); }
      #lead-value, #tail-value { flex: none; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

      .note { padding: 12px; color: var(--faded); font-size: 13.5px; text-align: center; }

      /* ---------- held sideways ----------

         A fight moves across, not up, so the phone will be held landscape — and
         a phone on its side has about 400px of height, which the stacked
         controls would eat entirely. Put them down the right instead and leave
         the footage the whole of the rest. */
      @media (orientation: landscape) and (max-height: 600px) {
        #live { flex-direction: row; }
        #live-note { display: none; }
        .actions { flex-direction: column; width: 180px; justify-content: center; }
        #start, #bookmark { font-size: 21px; padding: 20px 8px; }

        body[data-screen="review"] #review {
          display: grid;
          grid-template-columns: 1fr 300px;
          grid-template-rows: auto 1fr auto;
          grid-template-areas:
            "stage topbar"
            "stage band"
            "stage modes";
        }
        #review .stage { grid-area: stage; }
        #topbar { grid-area: topbar; padding-left: 0; }
        .band { grid-area: band; padding-left: 0; align-self: center; }
        #modes { grid-area: modes; padding-left: 0; flex-wrap: wrap; }
        #modes button { flex: 1 1 40%; }
        .strip[data-mode="loop"] { flex-wrap: wrap; }
        .strip[data-mode="loop"] button { flex: 1 1 40%; }
        .strip[data-mode="step"] { flex-wrap: wrap; }
        .strip[data-mode="step"] button { flex: 1 1 40%; }
      }
    </style>
  </head>
  <body data-screen="live">
    <!-- ---------------- live ---------------- -->
    <section id="live">
      <div class="stage">
        <video id="preview" playsinline muted autoplay></video>
        <div class="hud">
          <span id="recording-dot" hidden></span>
          <span id="elapsed">0:00</span>
          <span id="dots"></span>
          <span class="grow"></span>
          <button class="icon" id="info" title="What this device can do">&#9432;</button>
        </div>
      </div>
      <p class="note" id="live-note">Point it at the fight, then press START.</p>
      <div class="actions">
        <button id="start">START</button>
        <button id="bookmark" hidden>BOOKMARK</button>
        <button id="stop" hidden>STOP</button>
      </div>
    </section>

    <!-- ---------------- review ---------------- -->
    <section id="review" data-mode="loop">
      <nav id="topbar">
        <div id="tabs"></div>
        <button id="again">New bout</button>
        <button class="icon" id="info2" title="What this device can do">&#9432;</button>
      </nav>

      <div class="stage" id="stage">
        <video id="clip" playsinline></video>
        <span id="readout">+0.00s</span>
        <div id="shortfall"></div>
        <div id="progress"><i></i></div>
      </div>

      <div class="band">
        <!-- Loop: it goes round on its own, so the only question is how fast. -->
        <div class="strip" data-mode="loop">
          <button class="speed" data-rate="1">1&times;</button>
          <button class="speed" data-rate="0.5">&frac12;&times;</button>
          <button class="speed" data-rate="0.25">&frac14;&times;</button>
          <button class="speed" data-rate="0.125">&#8539;&times;</button>
        </div>

        <!-- Scrub: the slider is the whole interaction, so nothing else is here. -->
        <div class="strip" data-mode="scrub">
          <input id="scrub" type="range" step="1" />
          <label class="toggle">
            <input id="resume" type="checkbox" checked />
            keep playing when I let go
          </label>
        </div>

        <!-- Step: four targets, thumb-sized, two each way. -->
        <div class="strip" data-mode="step">
          <button data-step="-3">&#9664;&#9664; 3</button>
          <button data-step="-1">&#9664; 1</button>
          <button data-step="1">1 &#9654;</button>
          <button data-step="3">3 &#9654;&#9654;</button>
        </div>

        <!-- Shuttle: no control at all. The picture is the control. -->
        <div class="strip" data-mode="shuttle">
          <span class="hint">drag anywhere across the picture</span>
        </div>
      </div>

      <nav id="modes">
        <button data-mode="loop">Loop</button>
        <button data-mode="scrub">Scrub</button>
        <button data-mode="step">Step</button>
        <button data-mode="shuttle">Shuttle</button>
      </nav>
    </section>

    <div id="diag" hidden>
      <button class="close" id="diag-close">Close</button>
      <h2>how much to show either side of a mark</h2>
      <div class="tune">
        <label>before <input id="lead" type="range" min="500" max="4000" step="100" /><span id="lead-value"></span></label>
        <label>after <input id="tail" type="range" min="200" max="3000" step="100" /><span id="tail-value"></span></label>
      </div>
      <div id="diag-body"></div>
    </div>

    <script type="module" src="solo.js"></script>
  </body>
</html>
